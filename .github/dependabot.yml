version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (via eslint-config-next) doesn't support TS 7 yet, and
      # `npm run lint` crashes with it. Drop this once typescript-eslint adds
      # support: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next parses through Next's bundled Babel parser, whose
      # scope manager lacks addGlobals() that ESLint 10 requires
      # ("TypeError: scopeManager.addGlobals is not a function"). Stay on ESLint 9
      # until a Next release ships a compatible parser.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
